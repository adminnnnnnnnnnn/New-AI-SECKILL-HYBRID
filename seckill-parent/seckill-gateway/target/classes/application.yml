server:
  port: 8080

spring:
  application:
    name: seckill-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        register-enabled: false
    gateway:
      # 关闭服务发现，使用静态路由
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # 静态路由配置 - 适用于Docker环境
        - id: user-service
          uri: http://seckill-user-service:8085  # 如果用户服务在Docker中运行
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: http://seckill-product-service:8081  # 如果产品服务在Docker中运行
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: http://seckill-seckill-service:8084  # 直接路由到后端服务容器
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: seckill-service
          uri: http://seckill-seckill-service:8084  # 直接路由到后端服务容器
          predicates:
            - Path=/api/seckill/**
          filters:
            - StripPrefix=1
        # 备选方案：如果服务在宿主机上运行，使用host-gateway
        - id: seckill-service-host
          uri: http://host.docker.internal:8084  # 用于访问宿主机上的服务
          predicates:
            - Path=/api/seckill/**
          filters:
            - StripPrefix=1
            - RewritePath=/api/seckill/(?<remaining>.*), /$\{remaining}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG