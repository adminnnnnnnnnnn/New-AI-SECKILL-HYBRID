<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI API测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .container { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #409EFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #66b1ff; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { background: white; padding: 15px; border-radius: 4px; margin-top: 15px; border-left: 4px solid #409EFF; }
        .error { border-left-color: #f56c6c; }
        .success { border-left-color: #67c23a; }
        pre { background: #f9f9f9; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 AI API 测试工具</h1>
    
    <div class="container">
        <h3>测试1: 直接调用后端服务 (localhost:8084)</h3>
        <textarea id="question1" placeholder="请输入问题，例如：你好">你好</textarea>
        <button onclick="testDirect()" id="btn1">测试直接调用</button>
        <div id="result1"></div>
    </div>
    
    <div class="container">
        <h3>测试2: 通过Gateway调用 (localhost:8080)</h3>
        <textarea id="question2" placeholder="请输入问题，例如：你好">你好</textarea>
        <button onclick="testGateway()" id="btn2">测试Gateway调用</button>
        <div id="result2"></div>
    </div>
    
    <script>
        async function testDirect() {
            const btn = document.getElementById('btn1');
            const result = document.getElementById('result1');
            const question = document.getElementById('question1').value || '你好';
            
            btn.disabled = true;
            btn.textContent = '请求中...';
            result.innerHTML = '<p>⏳ 发送请求...</p>';
            
            try {
                const startTime = Date.now();
                const response = await fetch(`http://localhost:8084/seckill/ai/advice?question=${encodeURIComponent(question)}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const endTime = Date.now();
                const data = await response.json();
                
                result.innerHTML = `
                    <div class="result success">
                        <strong>✅ 成功！耗时: ${endTime - startTime}ms</strong><br/>
                        <strong>状态码:</strong> ${response.status}<br/>
                        <strong>完整响应:</strong>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <strong>AI回答:</strong>
                        <p>${data.data}</p>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="result error">
                        <strong>❌ 失败！</strong><br/>
                        <strong>错误信息:</strong> ${error.message}<br/>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '测试直接调用';
            }
        }
        
        async function testGateway() {
            const btn = document.getElementById('btn2');
            const result = document.getElementById('result2');
            const question = document.getElementById('question2').value || '你好';
            
            btn.disabled = true;
            btn.textContent = '请求中...';
            result.innerHTML = '<p>⏳ 发送请求...</p>';
            
            try {
                const startTime = Date.now();
                const response = await fetch(`http://localhost:8080/api/seckill/ai/advice?question=${encodeURIComponent(question)}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const endTime = Date.now();
                const data = await response.json();
                
                result.innerHTML = `
                    <div class="result success">
                        <strong>✅ 成功！耗时: ${endTime - startTime}ms</strong><br/>
                        <strong>状态码:</strong> ${response.status}<br/>
                        <strong>完整响应:</strong>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <strong>AI回答:</strong>
                        <p>${data.data}</p>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="result error">
                        <strong>❌ 失败！</strong><br/>
                        <strong>错误信息:</strong> ${error.message}<br/>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '测试Gateway调用';
            }
        }
    </script>
</body>
</html>
